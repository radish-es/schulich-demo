{{ define "main" }}
  <section class="section-sm pb-0">
    <div class="container">
      <div class="row border-border dark:border-darkmode-border justify-center border-b pb-14">
        <div class="lg:col-8 text-center">
          <div class="flex flex-col sm:flex-row items-center sm:items-start gap-6">
            <!-- Headshot Column -->
            <img 
              src="{{.Params.image }}" 
              alt="{{ .Title }}" 
              class="w-100 h-100 rounded-full object-cover shrink-0 border-2 border-gray-200"
            />

            <!-- Text Column -->
            <div class="text-center sm:text-left">
              <h2 class="text-xxl font-bold text-gray-900">{{ .Title }}</h2>
              <p class="text-lg font-medium text-black mb-2">{{.Params.position }}</p>
              <p class="text-gray-600 leading-relaxed font-bold">
                {{.Params.description}}
              </p>
              <div class="content mt-6">
                {{ .Content }}
              </div>
            </div>
          </div>
